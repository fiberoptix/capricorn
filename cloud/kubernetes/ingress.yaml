apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capricorn-ingress
  namespace: capricorn
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      # Backend API routes - must come first (more specific)
      - path: /api/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend
            port:
              number: 5002
      # Frontend (default route) - catches everything else
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 80

