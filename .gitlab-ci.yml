# Capricorn CI/CD Pipeline
# Deploys to QA (192.168.1.180) on develop branch
# Future: Deploy to GCP on production branch

stages:
  - build
  - push
  - deploy_qa
  - deploy_gcp

variables:
  REGISTRY: gitlab.gothamtechnologies.com:5050
  PROJECT_PATH: production/capricorn
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  QA_HOST: 192.168.1.180
  QA_USER: agamache
  QA_PROJECT_DIR: /home/agamache/projects/unified_ui_DEV_PROD_GCP_2026/capricorn

# ============================================================================
# BUILD STAGE - Build Frontend and Backend Images
# ============================================================================

build_frontend:
  stage: build
  image: docker:27
  tags:
    - docker
  script:
    - echo "Building frontend image..."
    - cd docker
    - docker build -f Dockerfile.frontend.qa -t $REGISTRY/$PROJECT_PATH/frontend:$IMAGE_TAG -t $REGISTRY/$PROJECT_PATH/frontend:latest ..
    - echo "Frontend build complete!"
  only:
    - develop

build_backend:
  stage: build
  image: docker:27
  tags:
    - docker
  script:
    - echo "Building backend image..."
    - cd docker
    - docker build -f Dockerfile.backend.qa -t $REGISTRY/$PROJECT_PATH/backend:$IMAGE_TAG -t $REGISTRY/$PROJECT_PATH/backend:latest ..
    - echo "Backend build complete!"
  only:
    - develop

# ============================================================================
# PUSH STAGE - Push Images to Container Registry
# ============================================================================

push_images:
  stage: push
  image: docker:27
  tags:
    - docker
  script:
    - echo "Logging into Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - echo "Pushing frontend images..."
    - docker push $REGISTRY/$PROJECT_PATH/frontend:$IMAGE_TAG
    - docker push $REGISTRY/$PROJECT_PATH/frontend:latest
    - echo "Pushing backend images..."
    - docker push $REGISTRY/$PROJECT_PATH/backend:$IMAGE_TAG
    - docker push $REGISTRY/$PROJECT_PATH/backend:latest
    - echo "All images pushed successfully!"
  only:
    - develop

# ============================================================================
# DEPLOY QA - Deploy to vm-kubernetes-1 @ 192.168.1.180
# ============================================================================

deploy_qa:
  stage: deploy_qa
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying Capricorn to QA host..."
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "cd /home/agamache/projects/unified_ui_DEV_PROD_GCP_2026/capricorn/docker && docker compose -f docker-compose.qa.deploy.yml down || true"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "docker login -u root -p REDACTED_GITLAB_PASSWORD gitlab.gothamtechnologies.com:5050"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "docker pull gitlab.gothamtechnologies.com:5050/production/capricorn/frontend:latest"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "docker pull gitlab.gothamtechnologies.com:5050/production/capricorn/backend:latest"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "docker pull postgres:15.5-alpine"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "docker pull redis:7.2.4-alpine"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "cd /home/agamache/projects/unified_ui_DEV_PROD_GCP_2026/capricorn/docker && docker compose -f docker-compose.qa.deploy.yml up -d"
    - ssh -o StrictHostKeyChecking=no agamache@192.168.1.180 "sleep 10 && docker ps | grep capricorn"
    - echo "Capricorn deployed to http://192.168.1.180:5001"
  environment:
    name: qa
    url: http://192.168.1.180:5001
  only:
    - develop
  when: on_success

# ============================================================================
# DEPLOY GCP - Deploy to Google Cloud Platform (Real Production)
# ============================================================================

deploy_gcp:
  stage: deploy_gcp
  image: hashicorp/terraform:latest
  tags:
    - docker
  before_script:
    - echo "Installing prerequisites..."
    - apk add --no-cache bash curl docker docker-cli-buildx
    - echo "Installing gcloud..."
    - curl -O https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz
    - tar -xf google-cloud-cli-linux-x86_64.tar.gz
    - ./google-cloud-sdk/install.sh --quiet --path-update=true
    - export PATH=$PATH:/builds/production/capricorn/google-cloud-sdk/bin
    - echo "Installing kubectl..."
    - gcloud components install kubectl --quiet
    - echo "Setting up GCP authentication..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud auth configure-docker gcr.io --quiet
  script:
    - echo "Deploying Capricorn to GCP..."
    - echo "Project ID is $GCP_PROJECT_ID"
    - cd scripts
    - chmod +x run-gcp.sh
    - ./run-gcp.sh start
    - echo "GCP deployment complete"
    - echo "Production URL is http://capricorn.gothamtechnologies.com"
  environment:
    name: production
    url: http://capricorn.gothamtechnologies.com
  only:
    - production
  when: manual
  allow_failure: false

# ============================================================================
# Notes:
# ============================================================================
# 
# QA Deployment (develop branch):
#   - Automatic on push
#   - Target: 192.168.1.180:5001
#   - Method: docker-compose.qa.deploy.yml
#
# GCP Deployment (production branch):
#   - Manual button click
#   - Target: Google Cloud Platform
#   - Method: run-gcp.sh script (Terraform + GKE)
#
# CI/CD Variables Required (set in GitLab project settings):
#   QA Deployment:
#     - CI_REGISTRY_USER: root
#     - CI_REGISTRY_PASSWORD: [masked]
#     - SSH_PRIVATE_KEY: [runner's private key]
#   
#   GCP Deployment:
#     - GCP_SERVICE_ACCOUNT_KEY: [base64 encoded service account JSON]
#     - GCP_PROJECT_ID: voltaic-cirrus-476620-h5

